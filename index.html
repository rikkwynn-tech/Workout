<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5-Day Split">
<link rel="apple-touch-icon" id="ti" href="">
<title>5-Day Split</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#16202a;--mu:#64707d;--ac:#0f766e;--on:#fff;--ln:#dde3e9;--in:#f3f6f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1216;--card:#161e25;--tx:#e8eef2;--mu:#8b98a5;--ac:#2dd4bf;--on:#062b27;--ln:#26313a;--in:#0f161b}}
:root[data-theme="dark"]{--bg:#0d1216;--card:#161e25;--tx:#e8eef2;--mu:#8b98a5;--ac:#2dd4bf;--on:#062b27;--ln:#26313a;--in:#0f161b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding:0 14px 96px}
header{padding:16px 2px 10px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mu);font-size:14px}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
.cnt{font-size:13px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 12px 6px;margin:12px 0}
h3{margin:0;font-size:17px;font-weight:700}
.mu{margin:2px 0 0;color:var(--mu);font-size:14px}.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.sn{width:20px;text-align:center;color:var(--mu);font-weight:700}
.row input{flex:1;min-width:0;height:46px;border:1px solid var(--ln);background:var(--in);color:var(--tx);border-radius:10px;font-size:18px;text-align:center;font-weight:600}
.row input:focus{outline:2px solid var(--ac);outline-offset:1px}
.ab{flex:1;color:var(--mu)}
.ck{width:46px;height:46px;border-radius:10px;border:2px solid var(--ln);background:transparent;color:transparent;font-size:22px;font-weight:800}
.ck.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.acts{display:flex;gap:10px;margin:18px 0}
.acts button{flex:1;height:50px;border-radius:12px;font-size:16px;font-weight:700;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.acts .p{background:var(--ac);border-color:var(--ac);color:var(--on)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:6px 0;font-size:11.5px;border-radius:10px}
nav button b{display:block;font-size:17px;color:inherit}
nav button.on{color:var(--ac);background:var(--in)}
#rest{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);font-weight:800;font-size:18px;padding:12px 18px;border-radius:26px;display:none}
</style></head>
<body>
<header><h1 id="t"></h1><p id="s"></p><div class="bar"><i id="pb"></i></div><div class="cnt" id="pc"></div></header>
<main id="m"></main>
<div class="acts"><button id="clr">Clear day</button><button id="fin" class="p">Finish workout</button></div>
<div id="rest"></div>
<nav id="nav"></nav>
<script>
const D=[
{n:"Upper A",f:"Chest emphasis",l:"Chest",ex:[
["Converging chest press",3,"6-8"],["High-to-low cable flies",2,"12-15"],["Smith machine incline press",2,"8-10"],["Plate loaded back rows",2,"8-10"],["Lat pull downs",2,"8-10"],["Machine lateral raises",2,"12-15"],["Rope push downs",2,"10-12"],["Cross body dumbbell curls",2,"6-8"],["Ab work",2,"",1]]},
{n:"Lower A",f:"Quad emphasis",l:"Quads",ex:[
["Leg extensions",2,"12-15","knee warm-up, quad pre-fatigue"],["Landmine squats",2,"8-10"],["Bulgarian split squats",2,"8-10","per leg"],["Prone leg curls",2,"10-12"],["Standing calf raises",3,"12-15"],["Wrist curls",2,"15"],["Reverse curls",2,"12"]]},
{n:"Upper B",f:"Back emphasis",l:"Back",ex:[
["Neutral grip pull ups",3,"8-10"],["Supported dumbbell rows",2,"8-10"],["Low cable back rows",2,"12-15"],["Dumbbell chest press",3,"10-12"],["Face pulls",2,"12-15"],["Overhead rope extensions",2,"10-12"],["Hammer curls",2,"10-12"]]},
{n:"Lower B",f:"Posterior chain emphasis",l:"Posterior",ex:[
["Romanian deadlifts",3,"8-10"],["Seated leg curls",2,"10-12"],["Trap bar deadlifts",2,"8-10"],["Unilateral leg press",2,"8-10","per leg"],["Leg extensions",2,"15"],["Seated calf raises",3,"12-15"],["Ab and core work",2,"",1]]},
{n:"Upper C",f:"Shoulders, biceps, triceps",l:"Arms",ex:[
["Dumbbell shoulder press",2,"8-10"],["Landmine press",2,"8-10"],["Dumbbell lateral raises",2,"12-15"],["Reverse pec deck",2,"12-15"],["Neutral grip tricep extensions",2,"8-10"],["Rope push downs",2,"12-15"],["Preacher curls",2,"6-8"],["Incline dumbbell curls",2,"10-12"]]}
];
let S=null;
try{S=JSON.parse(localStorage.getItem("split1"))}catch(e){}
S=S||{day:0,cur:{},hist:{},last:{}};
const save=()=>{try{localStorage.setItem("split1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
function rows(i){const c=S.cur[S.day]||(S.cur[S.day]={});return c[i]||(c[i]=[])}
function prog(){let t=0,n=0;D[S.day].ex.forEach((e,i)=>{const r=(S.cur[S.day]||{})[i]||[];for(let s=0;s<e[1];s++){t++;if(r[s]&&r[s].d)n++}});
$("#pb").style.width=(t?n/t*100:0)+"%";$("#pc").textContent=n+" of "+t+" sets done"+(S.last[S.day]?" · last finished "+S.last[S.day]:"")}
function render(){
const d=D[S.day];let h="";
d.ex.forEach((e,i)=>{
const nm=e[0],sets=e[1],reps=e[2],note=e[3],ab=e[4],hs=S.hist[nm]||[],r=rows(i);let x="";
for(let s=0;s<sets;s++){const v=r[s]||{},p=hs[s]||hs[hs.length-1]||{};
x+='<div class="row"><span class="sn">'+(s+1)+'</span>'+(ab?'<span class="ab">Round '+(s+1)+'</span>':
'<input inputmode="decimal" placeholder="'+(p.w||"weight")+'" value="'+(v.w||"")+'" data-i="'+i+'" data-s="'+s+'" data-k="w"><input inputmode="numeric" placeholder="'+(p.r||"reps")+'" value="'+(v.r||"")+'" data-i="'+i+'" data-s="'+s+'" data-k="r">')+
'<button class="ck'+(v.d?" on":"")+'" data-i="'+i+'" data-s="'+s+'" aria-label="Set done">✓</button></div>'}
const last=hs.length&&!ab?"Last time: "+hs.map(a=>(a.w||"–")+" × "+(a.r||"–")).join(", "):"";
h+='<section class="card"><h3>'+nm+'</h3><p class="mu">'+(ab?sets+" rounds":sets+" × "+reps)+(note?", "+note:"")+'</p>'+(last?'<p class="mu sm">'+last+'</p>':"")+x+'</section>'});
$("#m").innerHTML=h;
$("#t").textContent="Day "+(S.day+1)+": "+d.n;$("#s").textContent=d.f;
$("#nav").innerHTML=D.map((q,i)=>'<button data-d="'+i+'" class="'+(i==S.day?"on":"")+'"><b>'+(i+1)+'</b>'+q.l+'</button>').join("");
prog()}
let tm=null,left=0;
function rest(){clearInterval(tm);left=90;const el=$("#rest");el.style.display="block";
const f=()=>{el.textContent="Rest "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left--<=0){clearInterval(tm);el.style.display="none"}};f();tm=setInterval(f,1000)}
$("#rest").onclick=()=>{clearInterval(tm);$("#rest").style.display="none"};
$("#m").addEventListener("input",e=>{const t=e.target;if(!t.dataset.k)return;const r=rows(+t.dataset.i),s=+t.dataset.s;r[s]=r[s]||{};r[s][t.dataset.k]=t.value;save()});
$("#m").addEventListener("click",e=>{const b=e.target.closest(".ck");if(!b)return;const r=rows(+b.dataset.i),s=+b.dataset.s;r[s]=r[s]||{};r[s].d=!r[s].d;b.classList.toggle("on",!!r[s].d);save();prog();if(r[s].d)rest()});
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.day=+b.dataset.d;save();render();scrollTo(0,0)});
$("#fin").onclick=()=>{if(!confirm("Save this workout and clear the checkboxes?"))return;
D[S.day].ex.forEach((e,i)=>{const r=rows(i);const out=[];let any=false;for(let s=0;s<e[1];s++){const v=r[s]||{};if(v.w||v.r||v.d)any=true;out.push({w:v.w||"",r:v.r||""})}if(any&&!e[4])S.hist[e[0]]=out});
S.cur[S.day]={};S.last[S.day]=new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"});save();render();scrollTo(0,0)};
$("#clr").onclick=()=>{if(confirm("Clear everything entered for this day?")){S.cur[S.day]={};save();render()}};
try{const c=document.createElement("canvas");c.width=c.height=180;const g=c.getContext("2d");g.fillStyle="#0f766e";g.fillRect(0,0,180,180);g.fillStyle="#fff";g.font="800 96px -apple-system,Helvetica,Arial";g.textAlign="center";g.textBaseline="middle";g.fillText("5",90,96);g.font="700 24px -apple-system,Helvetica,Arial";g.fillText("DAY SPLIT",90,152);$("#ti").href=c.toDataURL("image/png")}catch(e){}
render();
</script></body></html>
